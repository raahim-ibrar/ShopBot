services:
  - type: web
    name: portpair-shopbot-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STOREFRONT_API_SECRET
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORTPAIR_MODEL_STAGE
        value: evaluation
      - key: LANGSMITH_TRACING
        value: "false"
